services:
  meshtasticbridge:
    build: .
    container_name: meshtasticbridge
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8080}:${APP_PORT:-8080}"
    environment:
      APP_PORT: ${APP_PORT:-8080}
      MESHTASTIC_DEVICE: ${MESHTASTIC_DEVICE:-/dev/ttyUSB0}
      MESHTASTIC_CALLSIGN: ${MESHTASTIC_CALLSIGN:-BRIDGE}
      MESHTASTIC_ACCEPT_BROADCAST: ${MESHTASTIC_ACCEPT_BROADCAST:-true}
      MESHTASTIC_CONNECT_ON_START: ${MESHTASTIC_CONNECT_ON_START:-true}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    devices:
      - "${MESHTASTIC_DEVICE:-/dev/ttyUSB0}:${MESHTASTIC_DEVICE:-/dev/ttyUSB0}"
